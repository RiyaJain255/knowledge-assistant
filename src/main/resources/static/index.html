<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Assistant</title>
<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --ink: #1c2033; --muted: #6b7190; --line: #e3e6f0;
    --accent: #4f46e5; --accent-ink: #ffffff; --accent-soft: #eceafd;
    --ok: #15803d; --ok-soft: #e3f6ea; --warn: #b45309; --warn-soft: #fdf1dc; --bad: #b91c1c; --bad-soft: #fde8e8;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141f; --panel: #1b1e2e; --ink: #e8eaf6; --muted: #9096b5; --line: #2a2e45;
      --accent: #7c75ff; --accent-ink: #11131f; --accent-soft: #272a4d;
      --ok: #4ade80; --ok-soft: #14301f; --warn: #fbbf24; --warn-soft: #3a2c10; --bad: #f87171; --bad-soft: #3b1818;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .hidden { display: none !important; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.primary:disabled { opacity: .55; cursor: default; }
  .btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  .btn.small { padding: 3px 8px; font-size: 13px; }
  input[type=text], input[type=email], input[type=password] {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }

  /* ---------- auth ---------- */
  .auth { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .auth-card { width: 100%; max-width: 380px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .auth-card h1 { margin: 0 0 4px; font-size: 22px; }
  .auth-card p { margin: 0 0 18px; color: var(--muted); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .auth-card .btn.primary { width: 100%; padding: 10px; margin-top: 4px; }
  .auth-switch { margin-top: 14px; text-align: center; color: var(--muted); font-size: 14px; }
  .auth-switch a { color: var(--accent); cursor: pointer; }
  .error { color: var(--bad); background: var(--bad-soft); padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }

  /* ---------- app layout ---------- */
  .app { height: 100%; display: grid; grid-template-columns: 250px minmax(0, 1fr) 320px; }
  .side, .docs { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .side { border-right: 1px solid var(--line); }
  .docs { border-left: 1px solid var(--line); }
  .pane-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .pane-head h2 { margin: 0; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  .brand { padding: 16px; font-weight: 700; font-size: 17px; display: flex; gap: 8px; align-items: center; }
  .brand span { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-size: 14px; }
  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .coll { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .coll:hover { background: var(--bg); }
  .coll.active { background: var(--accent-soft); }
  .coll .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .coll .count { font-size: 12px; color: var(--muted); }
  .coll .x { visibility: hidden; border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 16px; }
  .coll:hover .x { visibility: visible; }
  .coll .x:hover { color: var(--bad); }
  .side-foot { border-top: 1px solid var(--line); padding: 12px 16px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .side-foot .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat-head { padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  .chat-head h1 { margin: 0; font-size: 16px; }
  .chat-head small { color: var(--muted); }
  .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 360px; }
  .empty h3 { color: var(--ink); margin-bottom: 4px; }
  .msg { max-width: 760px; }
  .msg.user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); padding: 9px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .msg.bot { align-self: flex-start; width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 14px 14px 14px 4px; padding: 12px 16px; }
  .msg.bot .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.bot.err { border-color: var(--bad); background: var(--bad-soft); }
  .chip { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; border: 0; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 700; line-height: 20px; vertical-align: baseline; }
  .chip:hover { background: var(--accent); color: var(--accent-ink); }
  .sources { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .sources h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  details.src { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--bg); }
  details.src.flash { outline: 2px solid var(--accent); }
  details.src > summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; list-style-position: inside; font-size: 14px; }
  details.src .tag { font-weight: 700; color: var(--accent); }
  details.src .meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
  details.src.uncited { opacity: .75; }
  details.src .snippet { padding: 4px 12px 10px; font-size: 13px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; }
  .latency { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .typing { color: var(--muted); }
  .composer { padding: 14px 20px; border-top: 1px solid var(--line); background: var(--panel); display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; max-height: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
  .composer .btn.primary { padding: 10px 18px; }

  /* ---------- documents ---------- */
  .drop { margin: 12px; border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px 12px; text-align: center; color: var(--muted); cursor: pointer; }
  .drop.over, .drop:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .drop.disabled { opacity: .5; pointer-events: none; }
  .drop b { color: var(--ink); }
  .doc { padding: 10px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .doc .top { display: flex; align-items: center; gap: 8px; }
  .doc .fname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .doc .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; }
  .badge.READY { background: var(--ok-soft); color: var(--ok); }
  .badge.PROCESSING { background: var(--warn-soft); color: var(--warn); }
  .badge.FAILED { background: var(--bad-soft); color: var(--bad); }
  .doc .err { margin-top: 6px; font-size: 12px; color: var(--bad); overflow-wrap: anywhere; }
  .hint { padding: 16px; color: var(--muted); font-size: 14px; text-align: center; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 10; }
  #toast.show { opacity: 1; }

  @media (max-width: 1000px) {
    .app { grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 280px; }
    .docs { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); }
  }
  @media (max-width: 640px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 150px minmax(0, 1fr) 260px; }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { display: none; }
  }
</style>
</head>
<body>

<!-- ============ Auth ============ -->
<div id="auth" class="auth hidden">
  <form class="auth-card" id="authForm" autocomplete="on">
    <h1>Knowledge Assistant</h1>
    <p id="authSub">Sign in to chat with your documents.</p>
    <div id="authError" class="error hidden"></div>
    <div class="field hidden" id="nameField"><label for="displayName">Your name</label><input id="displayName" type="text" autocomplete="name" maxlength="100"></div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="8"></div>
    <button class="btn primary" id="authSubmit" type="submit">Sign in</button>
    <div class="auth-switch"><span id="switchText">No account yet?</span> <a id="switchLink">Create one</a></div>
  </form>
</div>

<!-- ============ App ============ -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><span>K</span> Knowledge Assistant</div>
    <div class="pane-head"><h2>Collections</h2><button class="btn small" id="newColl">+ New</button></div>
    <div class="list" id="collList"></div>
    <div class="side-foot"><span class="who" id="who"></span><button class="btn small" id="logout">Log out</button></div>
  </aside>

  <main class="chat">
    <div class="chat-head"><h1 id="scopeTitle">All collections</h1><small id="scopeSub"></small></div>
    <div class="messages" id="messages"></div>
    <form class="composer" id="composer">
      <textarea id="question" rows="1" maxlength="2000" placeholder="Ask a question about your documents…  (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="btn primary" id="send" type="submit">Ask</button>
    </form>
  </main>

  <section class="docs">
    <div class="pane-head"><h2>Documents</h2></div>
    <div class="drop" id="drop"><b>Drop files here</b> or click to browse<br><small>PDF, DOCX, TXT · up to 25 MB</small></div>
    <input type="file" id="fileInput" class="hidden" multiple accept=".pdf,.docx,.txt">
    <div class="list" id="docList"></div>
  </section>
</div>

<div id="toast"></div>

<script>
(() => {
  'use strict';

  // ------------------------------------------------------------------ state
  const $ = (id) => document.getElementById(id);
  const state = {
    token: localStorage.getItem('ka_token'),
    user: JSON.parse(localStorage.getItem('ka_user') || 'null'),
    collections: [],
    current: null,           // collection id, or null = all collections
    docs: [],
    chats: new Map(),        // scope key -> messages
    pollTimer: null,
    asking: false,
    registerMode: false,
  };
  const scopeKey = () => (state.current == null ? 'all' : String(state.current));
  const chat = () => { if (!state.chats.has(scopeKey())) state.chats.set(scopeKey(), []); return state.chats.get(scopeKey()); };

  // ------------------------------------------------------------------ helpers
  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') node.className = v;
      else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) node.setAttribute(k, v === true ? '' : v);
    }
    for (const c of children.flat()) if (c != null) node.append(c.nodeType ? c : document.createTextNode(String(c)));
    return node;
  }
  let toastTimer;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
  }
  function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }

  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (state.token) headers.Authorization = 'Bearer ' + state.token;
    let body = opts.body;
    if (body && !(body instanceof FormData)) { headers['Content-Type'] = 'application/json'; body = JSON.stringify(body); }
    const res = await fetch(path, { ...opts, headers, body });
    if (res.status === 401 && state.token) { logout(); throw new Error('Your session expired. Please sign in again.'); }
    if (!res.ok) {
      let msg = res.statusText || 'Request failed';
      try { const p = await res.json(); msg = p.detail || p.title || msg; } catch (_) {}
      throw new Error(msg);
    }
    return res.status === 204 ? null : res.json();
  }

  // ------------------------------------------------------------------ auth
  function setRegisterMode(on) {
    state.registerMode = on;
    $('nameField').classList.toggle('hidden', !on);
    $('authSub').textContent = on ? 'Create an account to get started.' : 'Sign in to chat with your documents.';
    $('authSubmit').textContent = on ? 'Create account' : 'Sign in';
    $('switchText').textContent = on ? 'Already have an account?' : 'No account yet?';
    $('switchLink').textContent = on ? 'Sign in' : 'Create one';
    $('password').autocomplete = on ? 'new-password' : 'current-password';
    $('authError').classList.add('hidden');
  }
  $('switchLink').addEventListener('click', () => setRegisterMode(!state.registerMode));
  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('authSubmit'); btn.disabled = true;
    try {
      const payload = { email: $('email').value, password: $('password').value };
      if (state.registerMode) payload.displayName = $('displayName').value || payload.email.split('@')[0];
      const res = await api(state.registerMode ? '/api/auth/register' : '/api/auth/login', { method: 'POST', body: payload });
      state.token = res.token; state.user = res.user;
      localStorage.setItem('ka_token', res.token); localStorage.setItem('ka_user', JSON.stringify(res.user));
      $('password').value = '';
      await showApp();
    } catch (err) {
      const box = $('authError'); box.textContent = err.message; box.classList.remove('hidden');
    } finally { btn.disabled = false; }
  });
  function logout() {
    state.token = null; state.user = null; state.collections = []; state.docs = []; state.chats.clear();
    localStorage.removeItem('ka_token'); localStorage.removeItem('ka_user');
    clearTimeout(state.pollTimer);
    $('app').classList.add('hidden'); $('auth').classList.remove('hidden');
  }
  $('logout').addEventListener('click', logout);

  // ------------------------------------------------------------------ collections
  async function loadCollections() {
    state.collections = await api('/api/collections');
    renderCollections();
  }
  function renderCollections() {
    const list = $('collList'); list.replaceChildren();
    const total = state.collections.reduce((n, c) => n + c.documentCount, 0);
    list.append(el('div', { class: 'coll' + (state.current == null ? ' active' : ''), onclick: () => selectCollection(null) },
      el('span', { class: 'name' }, 'All collections'), el('span', { class: 'count' }, total)));
    for (const c of state.collections) {
      list.append(el('div', { class: 'coll' + (state.current === c.id ? ' active' : ''), title: c.description || c.name, onclick: () => selectCollection(c.id) },
        el('span', { class: 'name' }, c.name), el('span', { class: 'count' }, c.documentCount),
        el('button', { class: 'x', title: 'Delete collection', onclick: (ev) => { ev.stopPropagation(); deleteCollection(c); } }, '×')));
    }
    const cur = state.collections.find((c) => c.id === state.current);
    $('scopeTitle').textContent = cur ? cur.name : 'All collections';
    $('scopeSub').textContent = cur ? (cur.description || '') : 'Questions search every collection you own';
  }
  async function selectCollection(id) {
    state.current = id; renderCollections(); renderMessages(); await loadDocs();
  }
  $('newColl').addEventListener('click', async () => {
    const name = prompt('Collection name (for example "HR policies"):');
    if (!name || !name.trim()) return;
    try {
      const c = await api('/api/collections', { method: 'POST', body: { name: name.trim() } });
      await loadCollections(); await selectCollection(c.id);
    } catch (err) { toast(err.message); }
  });
  async function deleteCollection(c) {
    if (!confirm(`Delete "${c.name}" and all ${c.documentCount} document(s) in it? This cannot be undone.`)) return;
    try {
      await api('/api/collections/' + c.id, { method: 'DELETE' });
      state.chats.delete(String(c.id));
      if (state.current === c.id) state.current = null;
      await loadCollections(); await selectCollection(state.current);
    } catch (err) { toast(err.message); }
  }

  // ------------------------------------------------------------------ documents
  async function loadDocs() {
    clearTimeout(state.pollTimer);
    const drop = $('drop');
    if (state.current == null) {
      state.docs = []; drop.classList.add('disabled');
      renderDocs(); return;
    }
    drop.classList.remove('disabled');
    try {
      state.docs = await api(`/api/collections/${state.current}/documents`);
    } catch (err) { toast(err.message); return; }
    renderDocs();
    if (state.docs.some((d) => d.status === 'PROCESSING')) {
      state.pollTimer = setTimeout(async () => { await loadDocs(); await loadCollections(); }, 2000);
    }
  }
  function renderDocs() {
    const list = $('docList'); list.replaceChildren();
    if (state.current == null) { list.append(el('div', { class: 'hint' }, 'Select a collection to upload and manage its documents.')); return; }
    if (!state.docs.length) { list.append(el('div', { class: 'hint' }, 'No documents yet. Upload a PDF, DOCX or TXT file to get started.')); return; }
    for (const d of state.docs) {
      const sub = [d.fileType.toUpperCase(), fmtSize(d.sizeBytes), d.status === 'READY' ? d.chunkCount + ' chunks' : null].filter(Boolean).join(' · ');
      list.append(el('div', { class: 'doc' },
        el('div', { class: 'top' },
          el('span', { class: 'fname', title: d.filename }, d.filename),
          el('span', { class: 'badge ' + d.status }, d.status === 'PROCESSING' ? 'Indexing…' : d.status === 'READY' ? 'Ready' : 'Failed'),
          el('button', { class: 'btn small danger', title: 'Delete document', onclick: () => deleteDoc(d) }, '✕')),
        el('div', { class: 'sub' }, sub),
        d.errorMessage ? el('div', { class: 'err' }, d.errorMessage) : null));
    }
  }
  async function deleteDoc(d) {
    if (!confirm(`Delete "${d.filename}"?`)) return;
    try { await api('/api/documents/' + d.id, { method: 'DELETE' }); await loadDocs(); await loadCollections(); }
    catch (err) { toast(err.message); }
  }
  async function uploadFiles(files) {
    if (state.current == null) { toast('Select or create a collection first.'); return; }
    for (const file of files) {
      const form = new FormData(); form.append('file', file);
      try { await api(`/api/collections/${state.current}/documents`, { method: 'POST', body: form }); }
      catch (err) { toast(`${file.name}: ${err.message}`); }
    }
    await loadDocs(); await loadCollections();
  }
  const drop = $('drop'), fileInput = $('fileInput');
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { uploadFiles([...fileInput.files]); fileInput.value = ''; });
  ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => uploadFiles([...e.dataTransfer.files]));

  // ------------------------------------------------------------------ chat
  function answerNode(text, sourcesEl) {
    const box = el('div', { class: 'answer' });
    text.split(/(\[\d{1,2}\])/g).forEach((part) => {
      const m = part.match(/^\[(\d{1,2})\]$/);
      if (m) {
        box.append(el('button', { class: 'chip', type: 'button', title: 'Show source ' + m[1], onclick: () => {
          const target = sourcesEl && sourcesEl.querySelector(`[data-n="${m[1]}"]`);
          if (!target) return;
          target.open = true; target.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
          target.classList.add('flash'); setTimeout(() => target.classList.remove('flash'), 1200);
        } }, m[1]));
      } else if (part) box.append(document.createTextNode(part));
    });
    return box;
  }
  function sourcesNode(sources) {
    if (!sources || !sources.length) return null;
    const wrap = el('div', { class: 'sources' }, el('h4', {}, 'Sources'));
    for (const s of sources) {
      const where = s.page != null ? `p. ${s.page}` : (s.chunkIndex != null ? `chunk ${s.chunkIndex + 1}` : '');
      wrap.append(el('details', { class: 'src' + (s.cited ? '' : ' uncited'), 'data-n': s.index },
        el('summary', {}, el('span', { class: 'tag' }, '[' + s.index + ']'), el('span', {}, s.filename),
          el('span', { class: 'meta' }, [where, 'match ' + s.score.toFixed(2)].filter(Boolean).join(' · '))),
        el('div', { class: 'snippet' }, s.snippet)));
    }
    return wrap;
  }
  function renderMessages() {
    const box = $('messages'); box.replaceChildren();
    const msgs = chat();
    if (!msgs.length) {
      box.append(el('div', { class: 'empty' }, el('h3', {}, 'Ask anything about your documents'),
        el('div', {}, state.collections.length ? 'Answers include citations so you can verify every claim.'
          : 'Create a collection on the left, upload some files, then ask a question.')));
      return;
    }
    for (const m of msgs) {
      if (m.role === 'user') { box.append(el('div', { class: 'msg user' }, m.text)); continue; }
      if (m.pending) { box.append(el('div', { class: 'msg bot' }, el('span', { class: 'typing' }, 'Searching your documents…'))); continue; }
      const src = m.error ? null : sourcesNode(m.sources);
      const bot = el('div', { class: 'msg bot' + (m.error ? ' err' : '') });
      bot.append(m.error ? el('div', {}, m.text) : answerNode(m.text, src));
      if (src) bot.append(src);
      if (!m.error && m.latencyMs != null) bot.append(el('div', { class: 'latency' }, (m.latencyMs / 1000).toFixed(1) + ' s'));
      box.append(bot);
    }
    box.scrollTop = box.scrollHeight;
  }
  async function ask(question) {
    if (state.asking) return;
    state.asking = true; $('send').disabled = true;
    const msgs = chat();
    msgs.push({ role: 'user', text: question });
    const pending = { role: 'bot', pending: true }; msgs.push(pending); renderMessages();
    try {
      const res = await api('/api/ask', { method: 'POST', body: { question, collectionId: state.current } });
      Object.assign(pending, { pending: false, text: res.answer, sources: res.sources, latencyMs: res.latencyMs });
    } catch (err) {
      Object.assign(pending, { pending: false, error: true, text: err.message });
    } finally {
      state.asking = false; $('send').disabled = false; renderMessages(); $('question').focus();
    }
  }
  $('composer').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('question').value.trim(); if (!q) return;
    $('question').value = ''; $('question').style.height = 'auto'; ask(q);
  });
  $('question').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('composer').requestSubmit(); }
  });
  $('question').addEventListener('input', (e) => {
    e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px';
  });

  // ------------------------------------------------------------------ boot
  async function showApp() {
    $('auth').classList.add('hidden'); $('app').classList.remove('hidden');
    $('who').textContent = state.user ? state.user.displayName : '';
    try {
      await loadCollections();
      await selectCollection(state.collections.length ? state.collections[0].id : null);
    } catch (err) { toast(err.message); }
  }
  if (state.token) showApp(); else { $('auth').classList.remove('hidden'); setRegisterMode(false); }
})();
</script>
</body>
